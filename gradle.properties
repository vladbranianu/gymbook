org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.onlyEnableUnitTestForTheTestedBuildType=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Kept off deliberately: the separately-applied org.jetbrains.kotlin.android plugin does an
# internal cast to AGP's legacy BaseExtension, which breaks under AGP 9's new DSL/built-in Kotlin
# ("Cannot add extension with name 'kotlin'" / ClassCastException on ApplicationExtensionImpl).
# Enabling either flag requires first removing that plugin in favor of AGP's built-in Kotlin
# support, then re-verifying KSP/Compose-compiler/Hilt compatibility - a real migration, not a flag flip.
android.builtInKotlin=false
android.newDsl=false
